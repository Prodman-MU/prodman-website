<!-- Prodman living-logo section. Load the sibling CSS and JS once per page. -->
<section
  class="brand-orbit"
  id="brand-orbit"
  data-logo-src="/resources/prodman-living-logo/Prodman-Logo.png"
  aria-labelledby="hero-title"
>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="orb orb--cyan" aria-hidden="true"></div>
  <div class="orb orb--acid" aria-hidden="true"></div>

  <header class="site-header">
    <a class="wordmark" href="#brand-orbit" aria-label="Prodman Club home">
      <span class="wordmark__signal" aria-hidden="true"></span>
      PROD/MAN
    </a>
    <p class="site-header__meta">MASTERS' UNION · GURUGRAM</p>
    <button class="motion-control" id="motion-control" type="button" aria-pressed="false">
      <span class="motion-control__icon" aria-hidden="true"></span>
      <span class="motion-control__label">Pause motion</span>
    </button>
  </header>

  <canvas id="brand-particles" aria-hidden="true"></canvas>

  <div class="coordinate coordinate--left" aria-hidden="true">
    <span>28.4595° N</span>
    <span>77.0266° E</span>
  </div>
  <div class="coordinate coordinate--right" aria-hidden="true">
    <span>IDENTITY / 01</span>
    <span>BUILD MODE: ON</span>
  </div>

  <div class="logo-system" aria-hidden="true">
    <img
      class="logo-system__ghost"
      src="/resources/prodman-living-logo/Prodman-Logo.png"
      alt=""
    />
    <div class="logo-system__sheen"></div>
    <div class="logo-system__scan"></div>
  </div>

  <div class="hero-copy">
    <p class="hero-copy__eyebrow">PRODUCT MANAGEMENT CLUB · 2026</p>
    <h1 id="hero-title">Build what should exist.</h1>
    <p class="hero-copy__body">
      We question boldly, prototype rapidly, and turn messy problems into products that matter.
    </p>
  </div>

  <div class="signal-strip" aria-hidden="true">
    <span>DISCOVER</span>
    <i></i>
    <span>DESIGN</span>
    <i></i>
    <span>VALIDATE</span>
    <i></i>
    <span>SHIP</span>
  </div>

  <div class="scroll-cue" aria-hidden="true">
    <span>EXPLORE</span>
    <i></i>
  </div>
</section>
